media: assets/images
content:
  - name: settings-el
    label: Ρυθμίσεις ιστοσελίδας — Ελληνικά
    type: file
    path: content/el/about.json
    fields:
      - name: title
        label: Τίτλος
        type: text
      - name: text
        label: Κείμενο Σχετικά
        type: textarea
  - name: settings-en
    label: Website settings — English
    type: file
    path: content/en/about.json
    fields:
      - name: title
        label: Title
        type: text
      - name: text
        label: About text
        type: textarea
  - name: lyrics-el
    label: Στίχοι — Ελληνικά
    type: collection
    path: content/el/lyrics
    filename: '{primary}.json'
    fields:
      - name: title
        label: Τίτλος
        type: text
        primary: true
      - name: body
        label: Στίχοι
        type: textarea
      - name: order
        label: Σειρά εμφάνισης
        type: number
  - name: writings-el
    label: Κείμενα — Ελληνικά
    type: collection
    path: content/el/writings
    filename: '{primary}.json'
    fields:
      - name: title
        label: Τίτλος
        type: text
        primary: true
      - name: body
        label: Κείμενο
        type: textarea
      - name: order
        label: Σειρά εμφάνισης
        type: number
  - name: lyrics-en
    label: Lyrics — English
    type: collection
    path: content/en/lyrics
    filename: '{primary}.json'
    fields:
      - name: title
        label: Title
        type: text
        primary: true
      - name: body
        label: Lyrics
        type: textarea
      - name: order
        label: Display order
        type: number
  - name: writings-en
    label: Writings — English
    type: collection
    path: content/en/writings
    filename: '{primary}.json'
    fields:
      - name: title
        label: Title
        type: text
        primary: true
      - name: body
        label: Text
        type: textarea
      - name: order
        label: Display order
        type: number
