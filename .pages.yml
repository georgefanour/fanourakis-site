  - name: press
    label: Συνεντεύξεις και Τύπος
    type: collection
    path: content/press
    filename: "{primary}.json"
    primary: title
    fields:
      - name: title
        label: Τίτλος
        type: string
        required: true
      - name: type
        label: Τύπος
        type: select
        required: true
        options:
          values:
            - Interview
            - Podcast
            - Radio
            - Article
            - Review
            - Video interview
      - name: outlet
        label: Μέσο ή εκπομπή
        type: string
      - name: date
        label: Ημερομηνία
        type: date
      - name: excerpt
        label: Απόσπασμα
        type: text
      - name: image
        label: Εικόνα ή logo
        type: image
      - name: url
        label: Εξωτερικό link
        type: string
      - name: featured
        label: Προτεινόμενο item
        type: boolean
        default: false
      - name: order
        label: Σειρά εμφάνισης
        type: number

  - name: photos
    label: Φωτογραφίες
    type: collection
    path: content/photos
    filename: "{primary}.json"
    primary: title
    fields:
      - name: title
        label: Τίτλος
        type: string
        required: true
      - name: image
        label: Εικόνα
        type: image
        required: true
      - name: alt
        label: Περιγραφή εικόνας
        type: string
        required: true
      - name: category
        label: Κατηγορία
        type: select
        options:
          values:
            - live
            - portrait
            - rehearsal
            - studio
            - street
            - other
      - name: order
        label: Σειρά εμφάνισης
        type: number
      - name: featured
        label: Προτεινόμενη φωτογραφία
        type: boolean
        default: false
