  - name: about-el
    label: "EL · Σχετικά — Ελληνικά"
    type: file
    path: content/el/about.json
    fields:
      - name: title
        label: "Τίτλος (εσωτερική χρήση)"
        type: string
        required: true
      - name: text
        label: "Κείμενο ενότητας «Σχετικά»"
        type: text
        required: true
      - name: image
        label: "Φωτογραφία ενότητας «Σχετικά»"
        type: image

  - name: about-en
    label: "EN · About — English"
    type: file
    path: content/en/about.json
    fields:
      - name: title
        label: "Title (internal use)"
        type: string
        required: true
      - name: text
        label: "About section text"
        type: text
        required: true
      - name: image
        label: "About section photo"
        type: image

  - name: music
    label: "EL · Δισκογραφία — Ελληνικά"
    type: collection
    path: content/music
    filename: "{primary}.json"
    primary: title
    view:
      fields: [title, year, release_type]
    fields:
      - name: title
        label: Τίτλος
        type: string
        required: true
      - name: cover
        label: Εξώφυλλο
        type: image
        required: true
      - name: release_type
        label: Τύπος κυκλοφορίας
        type: select
        required: true
        options:
          values: [Single, EP, Album, Collaboration]
      - name: year
        label: Έτος
        type: number
        required: true
      - name: description
        label: Περιγραφή
        type: text
      - name: artist_note
        label: "Λίγα λόγια για την κυκλοφορία"
        type: text
      - name: credits
        label: Credits
        type: text
      - name: youtube_url
        label: YouTube link
        type: string
      - name: spotify_url
        label: Spotify link
        type: string
      - name: bandcamp_url
        label: Bandcamp link
        type: string
      - name: featured
        label: Προτεινόμενη κυκλοφορία
        type: boolean
        default: false
      - name: order
        label: Σειρά εμφάνισης
        type: number

  - name: music-en
    label: "EN · Discography — English"
    type: collection
    path: content/en/music
