media:
  input: assets/images
  output: /assets/images
  extensions:
    - jpg
    - jpeg
    - png
    - webp
  rename: safe

content:
  - name: photos
    label: Φωτογραφίες
    type: collection
    path: content/photos
    filename: "{primary}.json"
    primary: title
    fields:
      - name: title
        label: Τίτλος
        type: string
        required: true
      - name: image
        label: Φωτογραφία
        type: image
        required: true
      - name: alt
        label: Περιγραφή εικόνας
        type: string
        required: true
      - name: category
        label: Κατηγορία
        type: select
        options:
          values:
            - live
            - backstage
            - portrait
            - studio
            - travel
            - other
      - name: featured
        label: Προτεινόμενη φωτογραφία
        type: boolean
        default: false

  - name: music
    label: Μουσική
    type: collection
    path: content/music
    filename: "{primary}.json"
    primary: title
    fields:
      - name: title
        label: Τίτλος
        type: string
        required: true
      - name: cover
        label: Εξώφυλλο
        type: image
        required: true
      - name: release_type
        label: Τύπος κυκλοφορίας
        type: select
        required: true
        options:
          values:
            - Single
            - EP
            - Album
            - Collaboration
      - name: year
        label: Έτος
        type: number
        required: true
      - name: description
        label: Περιγραφή
        type: text
      - name: youtube_url
        label: YouTube link
        type: string
      - name: spotify_url
        label: Spotify link
        type: string
      - name: featured
        label: Προτεινόμενη κυκλοφορία
        type: boolean
        default: false

  - name: live
    label: Live
    type: collection
    path: content/live
    filename: "{primary}.json"
    primary: title
    fields:
      - name: title
        label: Τίτλος εμφάνισης
        type: string
        required: true
      - name: date
        label: Ημερομηνία
        type: date
        required: true
      - name: venue
        label: Χώρος
        type: string
        required: true
      - name: city
        label: Πόλη
        type: string
        required: true
      - name: image
        label: Αφίσα ή φωτογραφία
        type: image
        required: true
      - name: alt
        label: Περιγραφή εικόνας
        type: string
        required: true
      - name: ticket_url
        label: Ticket ή event link
        type: string
      - name: status
        label: Κατάσταση
        type: select
        required: true
        options:
          values:
            - upcoming
            - archive
      - name: featured
        label: Προτεινόμενο live
        type: boolean
        default: false
