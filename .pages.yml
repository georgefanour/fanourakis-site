      - name: credits
        label: Credits
        type: text
      - name: youtube_url
        label: YouTube link
        type: string
      - name: spotify_url
        label: Spotify link
        type: string
      - name: bandcamp_url
        label: Bandcamp link
        type: string
      - name: featured
        label: Featured release
        type: boolean
        default: false
      - name: order
        label: Display order
