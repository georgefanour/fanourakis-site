media:
  input: assets/images
  output: /assets/images

content:
  - name: hero
    label: "Hero (Αρχική οθόνη)"
    type: file
    path: content/hero.json
    fields:
      - name: tag
        label: "Ετικέτα πάνω από τον τίτλο"
        type: string
      - name: title_line1
        label: "Τίτλος - πρώτη γραμμή"
        type: string
      - name: title_emphasis
        label: "Τίτλος - έμφαση (italic)"
        type: string
      - name: phrase
        label: "Φράση κάτω από τον τίτλο"
        type: text
      - name: background_image
        label: "Φόντο Hero"
        type: image
      - name: primary_button_label
        label: "Κείμενο κύριου κουμπιού"
        type: string
      - name: primary_button_url
        label: "Σύνδεσμος κύριου κουμπιού"
        type: string
      - name: secondary_button_label
        label: "Κείμενο δεύτερου κουμπιού"
        type: string
      - name: secondary_button_url
        label: "Σύνδεσμος δεύτερου κουμπιού"
        type: string
      - name: ticker_text
        label: "Κείμενο κυλιόμενης λωρίδας (ticker)"
        type: string

  - name: about
    label: "Σχετικά"
    type: file
    path: content/el/about.json
    fields:
      - name: text
        label: "Κείμενο Σχετικά"
        type: text
      - name: photo
        label: "Φωτογραφία"
        type: image

  - name: music
    label: "Δισκογραφία"
    type: collection
    path: content/music
    view:
      fields: [title, year, release_type]
    fields:
      - name: title
        label: "Τίτλος"
        type: string
      - name: release_type
        label: "Τύπος κυκλοφορίας"
        type: string
      - name: year
        label: "Έτος"
        type: string
      - name: cover
        label: "Εξώφυλλο"
        type: image
      - name: featured
        label: "Πιο πρόσφατη κυκλοφορία"
        type: boolean
      - name: spotify_url
        label: "Σύνδεσμος Spotify / streaming"
        type: string
      - name: youtube_url
        label: "Σύνδεσμος YouTube"
        type: string
      - name: description
        label: "Περιγραφή"
        type: text
      - name: order
        label: "Σειρά εμφάνισης"
        type: number

  - name: videos
    label: "Βίντεο"
    type: collection
    path: content/videos
    view:
      fields: [title, category]
    fields:
      - name: title
        label: "Τίτλος"
        type: string
      - name: category
        label: "Κατηγορία"
        type: select
        options:
          - { label: "Official", value: official }
          - { label: "Cover", value: cover }
          - { label: "Live session", value: live }
          - { label: "Acoustic", value: acoustic }
          - { label: "Studio", value: studio }
      - name: youtube_url
        label: "YouTube URL"
        type: string
      - name: description
        label: "Περιγραφή"
        type: text
      - name: order
        label: "Σειρά εμφάνισης"
        type: number

  - name: live
    label: "Live αρχείο"
    type: collection
    path: content/live
    view:
      fields: [title, venue]
    fields:
      - name: title
        label: "Τίτλος"
        type: string
      - name: image
        label: "Φωτογραφία"
        type: image
      - name: alt
        label: "Περιγραφή εικόνας (alt)"
        type: string
      - name: venue
        label: "Χώρος"
        type: string
      - name: city
        label: "Πόλη"
        type: string
      - name: date
        label: "Ημερομηνία"
        type: string
      - name: status
        label: "Κατάσταση / λεζάντα"
        type: string
      - name: order
        label: "Σειρά εμφάνισης"
        type: number

  - name: press
    label: "Συνεντεύξεις & Δύπος"
    type: collection
    path: content/press
    view:
      fields: [title, type]
    fields:
      - name: title
        label: "Τίτλος"
        type: string
      - name: type
        label: "Τύπος (π.χ. Podcast, Άρθρο)"
        type: string
      - name: image
        label: "Εικόνα / thumbnail"
        type: image
      - name: excerpt
        label: "Απόσπασμα"
        type: text
      - name: url
        label: "Εξωτερικός σύνδεσμος"
        type: string
      - name: order
        label: "Σειρά εμφάνισης"
        type: number

  - name: photos
    label: "Φωτογραφίες"
    type: collection
    path: content/photos
    view:
      fields: [title, caption]
    fields:
      - name: title
        label: "Τίτλος"
        type: string
      - name: image
        label: "Εικόνα"
        type: image
      - name: caption
        label: "Λεζάντα"
        type: text
      - name: alt
        label: "Περιγραφή εικόνας (alt)"
        type: string
      - name: order
        label: "Σειρά εμφάνισης"
        type: number

  - name: lyrics
    label: "Στίχοι"
    type: collection
    path: content/el/lyrics
    view:
      fields: [title]
    fields:
      - name: title
        label: "Τίτλος"
        type: string
      - name: body
        label: "Κείμενο"
        type: text
      - name: order
        label: "Σειρά εμφάνισης"
        type: number

  - name: writings
    label: "Κείμενα"
    type: collection
    path: content/el/writings
    view:
      fields: [title]
    fields:
      - name: title
        label: "Τίτλος"
        type: string
      - name: body
        label: "Κείμενο"
        type: text
      - name: order
        label: "Σειρά εμφάνισης"
        type: number
