<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Official website">
  <title>Γιώργος Φανουράκης</title>
  <style>
    :root{--bg:#f3f0e9;--ink:#171716;--muted:#6b6a64;--line:#c8c3ba;--paper:#faf8f4;--dark:#22211e;--max:1240px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Arial,Helvetica,sans-serif}a{color:inherit}img{display:block;width:100%;height:100%;object-fit:cover}.wrap{width:min(calc(100% - 40px),var(--max));margin:auto}.top{position:sticky;top:0;z-index:10;background:rgba(243,240,233,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.nav{min-height:72px;display:flex;gap:22px;align-items:center;justify-content:space-between}.brand{text-decoration:none;font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.navlinks{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.navlinks a{text-decoration:none;font-size:13px;text-transform:uppercase;letter-spacing:.08em}.navlinks a:hover{color:#b6452d}.hero{padding:85px 0 45px;display:grid;grid-template-columns:1.05fr .95fr;gap:34px;min-height:600px;align-items:end}.eyebrow,.meta{color:var(--muted);font-size:12px;letter-spacing:.11em;text-transform:uppercase}.hero h1{font:clamp(46px,8vw,110px)/.9 Georgia,serif;letter-spacing:-.06em;margin:14px 0 24px}.hero p{max-width:590px;font:clamp(19px,2.4vw,28px)/1.25 Georgia,serif;margin:0 0 30px}.actions{display:flex;gap:12px;flex-wrap:wrap}.button{display:inline-block;text-decoration:none;padding:12px 17px;border:1px solid var(--ink);font-size:12px;letter-spacing:.09em;text-transform:uppercase}.button.primary{background:var(--ink);color:var(--bg)}.hero-art{height:500px;background:#d5d0c6;overflow:hidden}.hero-art img{filter:grayscale(100%)}.placeholder{height:100%;display:grid;place-items:center;background:linear-gradient(140deg,#bdb7ad,#e3dfd6);color:#fff;font-size:13px;letter-spacing:.12em;text-transform:uppercase}section{padding:84px 0;border-top:1px solid var(--line)}.section-head{display:flex;justify-content:space-between;gap:25px;align-items:flex-end;margin-bottom:28px}.section-head h2{font:clamp(38px,5vw,68px)/.95 Georgia,serif;letter-spacing:-.05em;margin:0}.section-head p{max-width:480px;margin:0;color:var(--muted)}.grid{display:grid;gap:16px}.music{grid-template-columns:repeat(4,1fr)}.card{background:var(--paper);border:1px solid var(--line);min-width:0}.cover{aspect-ratio:1;background:#d1ccc2}.card-body{padding:16px}.card h3{font:24px/1.05 Georgia,serif;margin:8px 0}.card p{margin:0;color:var(--muted);font-size:14px}.links{margin-top:14px;display:flex;gap:12px;flex-wrap:wrap}.links a{font-size:12px;text-transform:uppercase;letter-spacing:.08em}.live{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.event{padding:21px;background:var(--dark);color:#f7f4ed;min-height:210px;display:flex;flex-direction:column;justify-content:space-between}.event .date{font:35px/1 Georgia,serif}.event h3{font:25px/1.05 Georgia,serif;margin:13px 0 4px}.event p{margin:0;color:#c9c6be}.event a{font-size:12px;letter-spacing:.08em;text-transform:uppercase}.videos{grid-template-columns:repeat(3,1fr)}.video{background:var(--dark);color:white}.video-frame{aspect-ratio:16/9;background:#383630;display:grid;place-items:center}.video-frame a{padding:11px 15px;border:1px solid #eee;text-decoration:none;font-size:12px;text-transform:uppercase;letter-spacing:.08em}.video .card-body p{color:#cfcac0}.gallery{grid-template-columns:repeat(4,1fr);grid-auto-rows:210px}.gallery a{position:relative;overflow:hidden;background:#d1ccc2}.gallery a:nth-child(3n){grid-row:span 2}.gallery a:nth-child(5n){grid-column:span 2}.gallery span{position:absolute;inset:auto 10px 9px;color:white;text-shadow:0 1px 5px #111;font-size:12px;letter-spacing:.06em}.text-block{max-width:790px;font:clamp(24px,3.2vw,42px)/1.18 Georgia,serif}.press{grid-template-columns:repeat(3,1fr)}.press .card{padding:20px;min-height:190px}.press h3{margin:12px 0;font:24px/1.1 Georgia,serif}.press p{color:var(--muted);font-size:14px}footer{padding:38px 0;background:var(--dark);color:#f4f0e9}footer .wrap{display:flex;justify-content:space-between;gap:25px;flex-wrap:wrap}footer p{margin:0;color:#ccc7bd;font-size:14px}.social{display:flex;gap:14px}.social a{font-size:12px;text-transform:uppercase;letter-spacing:.08em}.empty{border:1px dashed var(--line);padding:25px;color:var(--muted);font-size:14px;background:var(--paper)}@media(max-width:850px){.hero{grid-template-columns:1fr;padding-top:54px}.hero-art{height:360px}.music{grid-template-columns:repeat(2,1fr)}.live,.videos,.press{grid-template-columns:1fr}.gallery{grid-template-columns:repeat(2,1fr);grid-auto-rows:180px}.nav{padding:13px 0;align-items:flex-start}.navlinks{gap:9px}.navlinks a{font-size:11px}.section-head{display:block}.section-head p{margin-top:15px}}@media(max-width:450px){.wrap{width:min(calc(100% - 28px),var(--max))}.music{grid-template-columns:1fr}.gallery{grid-template-columns:1fr}.gallery a:nth-child(n){grid-row:auto;grid-column:auto}.hero h1{font-size:55px}}
  </style>
</head>
<body>
  <header class="top"><nav class="wrap nav"><a id="artist-name" class="brand" href="#home">Γιώργος Φανουράκης</a><div id="navigation" class="navlinks"></div></nav></header>
  <main>
    <section id="home" class="wrap hero"><div><div id="hero-kicker" class="eyebrow"></div><h1 id="hero-title"></h1><p id="hero-text"></p><div id="hero-actions" class="actions"></div></div><div class="hero-art" id="hero-image"></div></section>
    <section id="music"><div class="wrap"><div class="section-head"><h2 id="music-heading">Δισκογραφία</h2><p id="music-intro"></p></div><div id="music-grid" class="grid music"></div></div></section>
    <section id="live"><div class="wrap"><div class="section-head"><h2 id="live-heading">Live</h2><p id="live-intro"></p></div><div id="live-grid" class="live"></div></div></section>
    <section id="videos"><div class="wrap"><div class="section-head"><h2 id="videos-heading">Βίντεο</h2><p id="videos-intro"></p></div><div id="videos-grid" class="grid videos"></div></div></section>
    <section id="photos"><div class="wrap"><div class="section-head"><h2 id="photos-heading">Φωτογραφίες</h2><p id="photos-intro"></p></div><div id="photos-grid" class="grid gallery"></div></div></section>
    <section id="texts"><div class="wrap"><div id="texts-heading" class="eyebrow"></div><p id="texts-copy" class="text-block"></p></div></section>
    <section id="press"><div class="wrap"><div class="section-head"><h2 id="press-heading">Συνεντεύξεις &amp; Τύπος</h2><p id="press-intro"></p></div><div id="press-grid" class="grid press"></div></div></section>
  </main>
  <footer id="contact"><div class="wrap"><div><a id="footer-name" class="brand" href="#home">Γιώργος Φανουράκης</a><p id="contact-text"></p></div><div id="social-links" class="social"></div></div></footer>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>u&&u!=='#'?esc(u):'#';
const base=location.pathname.endsWith('/')?location.pathname:location.pathname.replace(/\/[^/]*$/,'/');
const path=p=>new URL(p,location.origin+base).pathname;
const image=(url,label)=>url?`<img src="${esc(url)}" alt="${esc(label)}">`:'<div class="placeholder">Πρόσθεσε φωτογραφία</div>';
const empty=message=>`<div class="empty">${esc(message)}</div>`;
async function loadJson(file){const response=await fetch(path(file),{cache:'no-store'});if(!response.ok)throw new Error(`${file}: ${response.status}`);return response.json()}
async function loadCollection(name){try{const entries=await loadJson(`content/${name}/index.json`);if(!Array.isArray(entries))throw new Error('Ο κατάλογος δεν είναι λίστα');const records=await Promise.all(entries.map(async entry=>{try{return await loadJson(`content/${name}/${entry}`)}catch(error){console.warn(error);return null}}));return records.filter(Boolean)}catch(error){console.warn(error);return []}}
function setText(id,value){const node=$(id);if(node)node.textContent=value??''}
async function render(){let site;try{site=await loadJson('content/site.json')}catch(error){console.error(error);document.querySelector('main').innerHTML='<section class="wrap"><h1>Οι ρυθμίσεις του site δεν φορτώθηκαν.</h1><p>Έλεγξε το αρχείο content/site.json στο repository.</p></section>';return}
const [music,live,videos,photos,press]=await Promise.all(['music','live','videos','photos','press'].map(loadCollection));
document.title=site.artistName||'Γιώργος Φανουράκης';setText('artist-name',site.artistName);setText('footer-name',site.artistName);
$('navigation').innerHTML=(site.navigation||[]).filter(item=>item.visible!==false).map(item=>`<a href="#${esc(item.target)}">${esc(item.label)}</a>`).join('');
const hero=site.hero||{};setText('hero-kicker',hero.kicker);setText('hero-title',hero.title);setText('hero-text',hero.text);$('hero-image').innerHTML=image(hero.image,site.artistName);$('hero-actions').innerHTML=(hero.actions||[]).map(item=>`<a class="button ${item.primary?'primary':''}" href="${safeUrl(item.url)}">${esc(item.label)}</a>`).join('');
const sections=site.sections||{};for(const key of ['music','live','videos','photos','press']){setText(`${key}-heading`,sections[key]?.heading);setText(`${key}-intro`,sections[key]?.intro)}setText('texts-heading',sections.texts?.heading);setText('texts-copy',sections.texts?.copy);
$('music-grid').innerHTML=music.length?music.map(item=>`<article class="card"><div class="cover">${image(item.cover,item.title)}</div><div class="card-body"><div class="meta">${esc(item.meta)}</div><h3>${esc(item.title)}</h3><p>${esc(item.description)}</p><div class="links">${(item.links||[]).map(link=>`<a href="${safeUrl(link.url)}" target="_blank" rel="noopener">${esc(link.label)} ↗</a>`).join('')}</div></div></article>`).join(''):empty('Πρόσθεσε την πρώτη κυκλοφορία από το CMS.');
const shownLive=live.filter(item=>item.visible!==false);$('live-grid').innerHTML=shownLive.length?shownLive.map(item=>`<article class="event"><div><div class="date">${esc(item.date)}</div><h3>${esc(item.title)}</h3><p>${esc(item.venue)}</p></div><a href="${safeUrl(item.ticketsUrl)}" target="_blank" rel="noopener">${esc(item.ticketsLabel||'Πληροφορίες')} ↗</a></article>`).join(''):empty('Δεν υπάρχουν προγραμματισμένα live.');
$('videos-grid').innerHTML=videos.length?videos.map(item=>`<article class="video"><div class="video-frame">${item.youtubeUrl?`<a href="${safeUrl(item.youtubeUrl)}" target="_blank" rel="noopener">Δες στο YouTube ↗</a>`:'<span>Πρόσθεσε YouTube URL</span>'}</div><div class="card-body"><div class="meta">${esc(item.category)}</div><h3>${esc(item.title)}</h3><p>${esc(item.description)}</p></div></article>`).join(''):empty('Πρόσθεσε το πρώτο βίντεο από το CMS.');
$('photos-grid').innerHTML=photos.length?photos.map(item=>`<a href="${safeUrl(item.image)}" target="_blank" rel="noopener">${image(item.image,item.caption)}<span>${esc(item.caption)}</span></a>`).join(''):empty('Πρόσθεσε φωτογραφίες από το CMS.');
$('press-grid').innerHTML=press.length?press.map(item=>`<article class="card"><div class="meta">${esc(item.type)}${item.date?' · '+esc(item.date):''}</div><h3>${esc(item.title)}</h3><p>${esc(item.excerpt)}</p><div class="links"><a href="${safeUrl(item.url)}" target="_blank" rel="noopener">Διάβασε ↗</a></div></article>`).join(''):empty('Πρόσθεσε την πρώτη αναφορά από το CMS.');
const contact=site.contact||{};setText('contact-text',contact.text);$('social-links').innerHTML=(contact.social||[]).map(item=>`<a href="${safeUrl(item.url)}" target="_blank" rel="noopener">${esc(item.label)}</a>`).join('');}
render();
</script>
</body>
</html>
