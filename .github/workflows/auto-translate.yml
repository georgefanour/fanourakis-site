name: Auto-translate Greek content to English

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - '!content/en/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run translation script
        run: node scripts/translate-content.js

      - name: Commit translated content
        run: |
          git config user.name "auto-translate-bot"
          git config user.email "actions@github.com"
          git add content/en content/.translation-cache.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-translate Greek content to English [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
