name: Deploy CMS site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build aggregated CMS content
        run: node scripts/build-content.cjs

      - name: Commit updated aggregated content
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update aggregated CMS content [skip ci]"
          file_pattern: 'content/*.json content/en/*.json content/el/*.json'

      - name: Build static publish folder
        shell: bash
        run: |
          mkdir -p _site
          shopt -s dotglob
          for item in *; do
            case "$item" in
              _site|node_modules|.git) ;;
              *) cp -R "$item" _site/ ;;
            esac
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
